<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Treasure Odyssey RPG - Ultimate Hardcore Evolution Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Inter', 'Jua', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            margin: 0; padding: 0; width: 100vw; min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center; overflow-x: hidden;
        }
        .app-container {
            max-width: 440px; width: 100%; min-height: 100vh; min-height: 100dvh;
            margin: 0 auto; display: flex; flex-direction: column; position: relative;
            background: linear-gradient(135deg, #090d16 0%, #020617 100%);
            box-shadow: 0 0 35px rgba(0,0,0,0.95);
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        
        .evo-stage-0 { border: 1.5px solid rgba(255,255,255,0.15) !important; }
        .evo-stage-1 { border: 3px solid #38bdf8 !important; box-shadow: 0 0 16px rgba(56, 189, 248, 0.7), inset 0 0 8px rgba(56, 189, 248, 0.4); }
        .evo-stage-2 { border: 3px solid #c084fc !important; box-shadow: 0 0 22px rgba(192, 132, 252, 0.9), inset 0 0 12px rgba(192, 132, 252, 0.6); }
        
        @keyframes evo-stage-3-pulse {
            0%, 100% { border-color: #fbbf24; box-shadow: 0 0 30px rgba(251, 191, 36, 0.95), inset 0 0 16px rgba(244, 63, 94, 0.8); }
            50% { border-color: #f43f5e; box-shadow: 0 0 50px rgba(244, 63, 94, 1), inset 0 0 24px rgba(251, 191, 36, 1); }
        }
        .evo-stage-3 { animation: evo-stage-3-pulse 2s infinite ease-in-out; border: 3.5px solid #fbbf24 !important; }
        
        @keyframes mythic-glow { 0%, 100% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.8); } 50% { box-shadow: 0 0 50px rgba(234, 179, 8, 1); } }
        .mythic-glow { animation: mythic-glow 2s infinite ease-in-out; border: 3px solid #fde047 !important; }
        
        @keyframes legendary-glow { 0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.7); } 50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.95); } }
        .legendary-glow { animation: legendary-glow 2.5s infinite ease-in-out; border: 2.5px solid #fbbf24 !important; }

        .glass-panel { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        .treasure-card-frame {
            border-radius: 1.25rem; position: relative; overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; padding: 8px; height: 195px; backdrop-filter: blur(8px);
        }
        .treasure-icon-box {
            width: 72px; height: 72px; border-radius: 1rem; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(15,23,42,0.95) 0%, rgba(2,6,23,0.98) 100%);
            box-shadow: inset 0 3px 8px rgba(255,255,255,0.2), 0 6px 16px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.12);
        }
        @keyframes portal-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.04); } 100% { transform: rotate(360deg) scale(1); } }
        .portal-ring { animation: portal-spin 12s linear infinite; }
        @keyframes portal-reverse { 0% { transform: rotate(360deg) scale(1); } 50% { transform: rotate(180deg) scale(0.96); } 100% { transform: rotate(0deg) scale(1); } }
        .portal-ring-rev { animation: portal-reverse 8s linear infinite; }
        @keyframes float-anim { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-4px) rotate(0.5deg); } }
        .floating { animation: float-anim 3.5s infinite ease-in-out; }
    </style>
</head>
<body>

            <button onclick="switchTab('gacha')" id="nav-btn-gacha" class="flex flex-col items-center justify-center w-1/6 py-1 text-amber-400 transition">
                <span class="text-base">⛩️</span>
                <span class="text-[9px] mt-0.5 font-medium">뽑기</span>
            </button>
            <button onclick="switchTab('inventory')" id="nav-btn-inventory" class="flex flex-col items-center justify-center w-1/6 py-1 text-slate-400 transition">

                <span class="text-[9px] mt-0.5 font-medium">보관함</span>
            </button>
            <button onclick="switchTab('codex')" id="nav-btn-codex" class="flex flex-col items-center justify-center w-1/6 py-1 text-slate-400 transition">
                <span class="text-base">📖</span>
                <span class="text-[9px] mt-0.5 font-medium">도감</span>
            </button>
            <button onclick="switchTab('upgrade')" id="nav-btn-upgrade" class="flex flex-col items-center justify-center w-1/6 py-1 text-slate-400 transition">
                <span class="text-base">⚡</span>
                <span class="text-[9px] mt-0.5 font-medium">강화</span>
            </button>
            <button onclick="switchTab('battle')" id="nav-btn-battle" class="flex flex-col items-center justify-center w-1/6 py-1 text-slate-400 transition">
                <span class="text-base">⚔️</span>
                <span class="text-[9px] mt-0.5 font-medium">전투</span>
            </button>
            <button onclick="switchTab('trade')" id="nav-btn-trade" class="flex flex-col items-center justify-center w-1/6 py-1 text-slate-400 transition">
                <span class="text-base">🤝</span>
                <span class="text-[9px] mt-0.5 font-medium">교환실</span>
            </button>
        </nav>

    </div>

        function sortInventory() {
            const rarityOrder = { MYTHIC: 5, LEGENDARY: 4, EPIC: 3, RARE: 2, COMMON: 1 };
            gameState.inventory.sort((a, b) => {
                if (a.evolutionStage !== b.evolutionStage) return b.evolutionStage - a.evolutionStage;
                if (b.enhanceLevel !== a.enhanceLevel) return b.enhanceLevel - a.enhanceLevel;
                const baseA = ALL_TREASURES_DATABASE.find(t => t.id === a.baseId);
                const baseB = ALL_TREASURES_DATABASE.find(t => t.id === b.baseId);
                const rA = rarityOrder[baseA ? baseA.rarity : 'COMMON'];
                const rB = rarityOrder[baseB ? baseB.rarity : 'COMMON'];
                if (rA !== rB) return rB - rA;
                return (baseB ? baseB.basePower : 0) - (baseA ? baseA.basePower : 0);
            });
        }

        function initGame() {
            generateTreasureDatabase();
            const saved = localStorage.getItem(GAME_DATA_KEY);
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                    if (gameState.gold === undefined) gameState.gold = 20000;
                    if (!gameState.usedTradeCodes) gameState.usedTradeCodes = [];
                    if (gameState.recordDungeonFloor === undefined) gameState.recordDungeonFloor = 1;
                    gameState.inventory.forEach(item => {
                        if (item.enhanceLevel === undefined) item.enhanceLevel = 0;
                        if (item.evolutionStage === undefined) item.evolutionStage = 0;
                    });
                } catch (e) {
                    giveStartingTreasures();
                }
            } else {
                giveStartingTreasures();
            }
            sortInventory();
            validateActiveTreasure();
            switchTab('gacha');
            updateHeader();
        }

        function validateActiveTreasure() {
            if (gameState.inventory.length > 0) {
                const exists = gameState.inventory.some(i => i.uid === gameState.activeTreasureUid);
                if (!exists) {
                    gameState.activeTreasureUid = gameState.inventory[0].uid;
                }
            } else {
                gameState.activeTreasureUid = null;
            }
        }

        function giveStartingTreasures() {
            gameState.gold = 20000;
            gameState.gems = 800;
            gameState.usedTradeCodes = [];
            gameState.recordDungeonFloor = 1;
            const starters = [ALL_TREASURES_DATABASE[0], ALL_TREASURES_DATABASE[45], ALL_TREASURES_DATABASE[75]];
            starters.forEach(t => {
                gameState.inventory.push({
                    uid: `init_${t.id}_${Date.now()}_${Math.random()}`,
                    baseId: t.id,
                    enhanceLevel: 0,
                    evolutionStage: 0
                });
                if (!gameState.codexUnlocked.includes(t.id)) gameState.codexUnlocked.push(t.id);
            });
            saveGame();
        }

        function saveGame() {
            sortInventory();
            validateActiveTreasure();
            localStorage.setItem(GAME_DATA_KEY, JSON.stringify(gameState));
            updateHeader();

        function performGacha(count) {
            const cost = count === 1 ? 500 : 5000;
            if (gameState.gold < cost) {
                showToast("❌ 골드가 부족합니다!");
                return;
            }
            gameState.gold -= cost;

            const results = [];
            for (let i = 0; i < count; i++) {
                const rand = Math.random();
                let chosenRarityKey = 'COMMON';
                let cumulative = 0;
                for (const [rKey, rObj] of Object.entries(RARITIES)) {
                    cumulative += rObj.chance;
                    if (rand <= cumulative) {
                        chosenRarityKey = rKey;
                        break;
                    }
                }
                const pool = ALL_TREASURES_DATABASE.filter(t => t.rarity === chosenRarityKey && t.name !== '사룡');
                const picked = pool[Math.floor(Math.random() * pool.length)];
                
                results.push(picked);
                gameState.inventory.push({
                    uid: `item_${picked.id}_${Date.now()}_${Math.random()}`,
                    baseId: picked.id,
                    enhanceLevel: 0,
                    evolutionStage: 0
                });
                if (!gameState.codexUnlocked.includes(picked.id)) gameState.codexUnlocked.push(picked.id);
            }

            saveGame();
            showGachaResultModal(results);
        }

        function confirmSell(uid, price) {
            const item = gameState.inventory.find(i => i.uid === uid);
            if (item) {
                const base = ALL_TREASURES_DATABASE.find(t => t.id === item.baseId);
                if (base && base.name === '사룡') {

            if (baseName === "대지의 티탄 방패") {
                if (targetStage === 1) return { reqEnhance: 10, gemCost: 100, items: [{ name: "정령왕의 홀", stage: 0, count: 1, rarity: '영웅' }, { name: "거친 돌멩이", stage: 0, count: 3, rarity: '일반' }] };
                if (targetStage === 2) return { reqEnhance: 15, gemCost: 300, items: [{ name: "천상의 날개", stage: 0, count: 1, rarity: '영웅' }, { name: "오팔 브로치", stage: 0, count: 3, rarity: '희귀' }] };
                if (targetStage === 3) return { reqEnhance: 20, gemCost: 500, items: [{ name: "태양의 브로치", stage: 0, count: 2, rarity: '영웅' }, { name: "토파즈 귀걸이", stage: 0, count: 4, rarity: '희귀' }] };
            }

            // Fallback unique recipe for any remaining Legendary
            if (ALL_TREASURES_DATABASE.find(t => t.name === baseName && t.rarity === 'LEGENDARY')) {
                if (targetStage === 1) return { reqEnhance: 10, gemCost: 100, items: [{ name: "왕실의 마법 가면", stage: 0, count: 1, rarity: '영웅' }, { name: "빛바랜 엽전", stage: 0, count: 2, rarity: '일반' }] };
                if (targetStage === 2) return { reqEnhance: 15, gemCost: 300, items: [{ name: "마법사의 수정구", stage: 0, count: 1, rarity: '영웅' }, { name: "사파이어 펜던트", stage: 0, count: 2, rarity: '희귀' }] };
                if (targetStage === 3) return { reqEnhance: 20, gemCost: 500, items: [{ name: "용기사의 방패", stage: 0, count: 2, rarity: '영웅' }, { name: "은빛 단검", stage: 0, count: 2, rarity: '희귀' }] };
            }

            return { reqEnhance: 10, gemCost: 100, items: [] };
        }

        function renderUpgradeView(container) {
            validateActiveTreasure();
            const item = gameState.inventory.find(i => i.uid === gameState.activeTreasureUid);

            let requiredEnhance = nextStage === 1 ? 10 : (nextStage === 2 ? 15 : 20);
            let requiredGems = nextStage === 1 ? 100 : (nextStage === 2 ? 300 : 500);

            html += `
                <div class="glass-panel p-3.5 rounded-2xl border border-slate-700/80">
                    <div class="flex justify-between items-center mb-2">

            if (item.evolutionStage < 3) {
                if (isLegendaryOrMythic && recipe && recipe.items.length > 0) {
                    html += `

                    recipe.items.forEach(req => {

                        gameState.inventory.forEach(inv => {

                        html += `<div class="${hasEnough ? 'text-emerald-400' : 'text-rose-400'}">· ${req.name} [${req.rarity}] (${req.stage}진) x${req.count} (보유: ${countFound})</div>`;

                    html += `</div>`;

                html += `

            gameState.activeTreasureUid = uid;

            renderUpgradeView(document.getElementById('main-content'));

        }

        function enhanceItem(uid) {
            const item = gameState.inventory.find(i => i.uid === uid);
            if (!item) return;
            if (gameState.gold < 500) {
                showToast("❌ 골드가 부족합니다! (필요: 500 골드)");
                return;
            }

            gameState.gold -= 500;
            let successRate = Math.max(25, 95 - item.enhanceLevel * 2.5);

            const rand = Math.random() * 100;
            if (rand <= successRate) {
                item.enhanceLevel += 1;
                showToast(`🎉 강화 성공! (+${item.enhanceLevel})`);
            } else {
                showToast("❌ 강화 실패...");
            }

            saveGame();
            renderUpgradeView(document.getElementById('main-content'));
        }

        function evolveItem(uid) {
            const item = gameState.inventory.find(i => i.uid === uid);
            if (!item) return;
            if (item.evolutionStage >= 3) {
                showToast("이미 최고 단계로 진화했습니다.");
                return;
            }

            const base = ALL_TREASURES_DATABASE.find(t => t.id === item.baseId);
            let nextStage = item.evolutionStage + 1;
            let reqEnhance = nextStage === 1 ? 10 : (nextStage === 2 ? 15 : 20);
            let gemCost = nextStage === 1 ? 100 : (nextStage === 2 ? 300 : 500);
            let isLegendaryOrMythic = (base.rarity === 'LEGENDARY' || base.rarity === 'MYTHIC');
            let recipe = isLegendaryOrMythic ? getHardcoreRecipe(base.name, nextStage) : null;

            if (item.enhanceLevel < reqEnhance) {
                showToast(`❌ 강화 수치 +${reqEnhance} 이상이 필요합니다!`);
                return;
            }
            if (gameState.gems < gemCost) {
                showToast(`❌ 다이아가 부족합니다! (필요: 💎 ${gemCost})`);
                return;
            }

            let consumedUids = [];
            if (isLegendaryOrMythic && recipe && recipe.items.length > 0) {
                for (let req of recipe.items) {
                    let matched = 0;
                    let potentialUids = [];
                    gameState.inventory.forEach(inv => {
                        const b = ALL_TREASURES_DATABASE.find(t => t.id === inv.baseId);
                        if (b && b.name === req.name && inv.evolutionStage === req.stage && inv.uid !== item.uid && !consumedUids.includes(inv.uid)) {
                            potentialUids.push(inv.uid);
                            matched++;
                        }
                    });

                    if (matched < req.count) {
                        showToast(`❌ 진화 재료 부족: ${req.name} (${req.stage}진) ${req.count}개가 필요합니다!`);
                        return;
                    }

                    for (let c = 0; c < req.count; c++) {
                        consumedUids.push(potentialUids[c]);
                    }
                }
            }

            gameState.gems -= gemCost;
            if (consumedUids.length > 0) {
                gameState.inventory = gameState.inventory.filter(inv => !consumedUids.includes(inv.uid));
            }
            item.evolutionStage += 1;
            saveGame();
            showToast(`🌟 차원 진화 성공! (${item.evolutionStage}단계 도달)`);
            renderUpgradeView(document.getElementById('main-content'));
        }

        /* --- 5. BATTLE ARENA --- */
        const EPIC_BOSS_NAMES = [
            "공허의 파괴신 벨제부르", "심연의 지배자 카오스 드래곤", "혼돈의 군주 아포칼립스",

                    </div>

                    <div class="w-full max-w-xs space-y-3 pt-1">

                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-sm font-bold text-purple-300 font-['Jua']">🏆 기록 던전 (무한 경쟁)</span>
                                    <span class="text-[10px] bg-purple-900/60 text-purple-200 px-2 py-0.5 rounded font-mono">나의 기록: ${currentFloor}층</span>
                                </div>
                                <p class="text-[11px] text-slate-300 mb-2">1분 제한시간! 층마다 강해지는 보스를 격파하고 보상을 획득하세요!</p>
                            </div>
                            <button onclick="startPrecisionBattle('record')" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 text-white font-bold rounded-xl text-xs transition shadow-lg active:scale-95">⚔️ 기록 던전 도전 (${currentFloor}층)</button>

        function startPrecisionBattle(bossType) {
            const main = document.getElementById('main-content');
            validateActiveTreasure();
            const activeItem = gameState.inventory.find(i => i.uid === gameState.activeTreasureUid);
            const activeBase = activeItem ? ALL_TREASURES_DATABASE.find(t => t.id === activeItem.baseId) : null;
            const playerPower = activeItem && activeBase ? Math.floor(activeBase.basePower * Math.pow(1.15, activeItem.enhanceLevel) * Math.pow(1.5, activeItem.evolutionStage)) : 100;

            let rarityKey = activeBase ? activeBase.rarity : 'COMMON';
            let rangeMultiplier = 3.0;
            let bulletColor = '#94a3b8';
            let ringColor = '#94a3b8';

            if (rarityKey === 'COMMON') { rangeMultiplier = 2.0; bulletColor = '#94a3b8'; ringColor = '#94a3b8'; }
            else if (rarityKey === 'RARE') { rangeMultiplier = 3.0; bulletColor = '#38bdf8'; ringColor = '#38bdf8'; }
            else if (rarityKey === 'EPIC') { rangeMultiplier = 4.0; bulletColor = '#c084fc'; ringColor = '#c084fc'; }
            else if (rarityKey === 'LEGENDARY') { rangeMultiplier = 5.0; bulletColor = '#f59e0b'; ringColor = '#f59e0b'; }
            else if (rarityKey === 'MYTHIC') { rangeMultiplier = 5.5; bulletColor = '#ef4444'; ringColor = '#ef4444'; }

            let repMeta = activeBase ? getEvolutionMeta(activeBase, activeItem.evolutionStage) : null;
            let rawSvgInner = repMeta && repMeta.rawSvg ? repMeta.rawSvg : '<circle cx="32" cy="32" r="20" fill="#38bdf8"/>';

            let bossName = '👺 초록 고블린 킹';
            let maxHp = 10000;
            let currentFloor = gameState.recordDungeonFloor || 1;

            if (bossType === 'dragon') {
                bossName = '🐉 붉은 드래곤';
                maxHp = 1000000;
            } else if (bossType === 'record') {
                let nameIdx = (currentFloor - 1) % EPIC_BOSS_NAMES.length;
                bossName = `[${currentFloor}층] ${EPIC_BOSS_NAMES[nameIdx]}`;
                maxHp = Math.floor(1000000 * Math.pow(1.3, currentFloor - 1));
            } else if (bossType === 'training') {
                bossName = '🎯 훈련용 샌드백';
                maxHp = 999999999;
            }

            const isMythic = rarityKey === 'MYTHIC';
            const mythicIconHtml = (isMythic && repMeta) ? repMeta.svg : '';

            main.innerHTML = `
                <div class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-between z-30 select-none overflow-hidden" style="touch-action: none;">
                    <!-- Top HUD -->
                    <div class="w-full px-4 py-2 bg-slate-900/95 border-b border-slate-800 flex flex-col items-center space-y-1 flex-shrink-0 z-40">
                        <div class="flex justify-between w-full text-xs font-bold">
                            <span class="text-rose-400">${bossName}</span>
                            <span id="battle-timer" class="text-cyan-300 font-mono text-sm">${bossType === 'dragon' || bossType === 'training' ? '∞' : (bossType === 'record' ? '60s' : '30s')}</span>
                            <span class="text-emerald-400">전투력(데미지): ${playerPower.toLocaleString()}</span>
                        </div>
                        <div class="w-full bg-slate-950 h-3 rounded-full overflow-hidden border border-slate-700 relative">
                            <div id="boss-hp-bar" class="bg-rose-500 h-full w-full transition-all duration-75"></div>
                            <div class="absolute inset-0 flex items-center justify-center text-[8px] font-bold text-white" id="boss-hp-text">${bossType === 'training' ? '∞ HP' : `${maxHp.toLocaleString()} / ${maxHp.toLocaleString()}`}</div>
                        </div>
                    </div>

                    <!-- Arena Canvas -->
                    <div class="flex-1 w-full relative bg-[#060913] overflow-hidden" id="arena-container">
                        <canvas id="battle-canvas" class="w-full h-full block"></canvas>
                        ${bossType === 'training' ? `
                            <button onclick="exitTrainingGround()" class="absolute top-3 right-3 px-3 py-1.5 bg-slate-800/90 hover:bg-slate-700 text-slate-200 text-xs rounded-xl border border-slate-600 shadow-lg z-50">🚪 훈련장 나가기</button>
                        ` : ''}
                    </div>

                    <!-- Control Box -->
                    <div class="h-36 w-full bg-slate-900/95 border-t border-slate-800 grid grid-cols-3 items-center px-4 flex-shrink-0 z-40">
                        <div class="flex justify-center items-center">
                            <div id="pad-left" class="w-28 h-28 rounded-2xl bg-slate-950/80 border-2 border-slate-600/70 relative flex items-center justify-center shadow-lg">
                                <div id="knob-left" class="w-12 h-12 rounded-xl bg-slate-600/80 absolute shadow-md transition-transform duration-75 pointer-events-none"></div>
                            </div>
                        </div>
                        <div class="flex justify-center items-center">
                            ${isMythic ? `
                                <div id="skill-btn" class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-purple-900 via-slate-900 to-indigo-950 border-2 border-purple-400/80 relative flex items-center justify-center shadow-[0_0_15px_rgba(168,85,247,0.6)] cursor-pointer active:scale-95 transition">
                                    <div class="absolute inset-0 rounded-xl overflow-hidden flex items-center justify-center opacity-85 pointer-events-none">${mythicIconHtml}</div>
                                    <div id="skill-cooldown-overlay" class="absolute inset-0 bg-black/80 rounded-xl flex items-center justify-center text-xs font-mono font-bold text-amber-300 hidden pointer-events-none">15s</div>
                                </div>
                            ` : ''}
                        </div>
                        <div class="flex justify-center items-center">
                            <div id="pad-right" class="w-28 h-28 rounded-2xl bg-slate-950/80 border-2 border-slate-600/70 relative flex items-center justify-center shadow-lg">
                                <div id="knob-right" class="w-12 h-12 rounded-xl bg-slate-600/80 absolute shadow-md transition-transform duration-75 pointer-events-none"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            initPrecisionArenaGame(playerPower, rangeMultiplier, bulletColor, ringColor, rawSvgInner, bossType, activeBase ? activeBase.name : '', maxHp);
        }

        function exitTrainingGround() {
            if (window.activeBattleAnimFrame) {
                cancelAnimationFrame(window.activeBattleAnimFrame);
                window.activeBattleAnimFrame = null;
            }
            switchTab('battle');
            showToast("🎯 훈련장을 종료했습니다.");
        }

        function initPrecisionArenaGame(playerPower, rangeMultiplier, bulletColor, ringColor, rawSvgInner, bossType, treasureName, initialMaxHp) {
            const canvas = document.getElementById('battle-canvas');
            const container = document.getElementById('arena-container');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            resizeCanvas();

            let player = {
                x: canvas.width / 2,
                y: canvas.height - 80,
                radius: 22,
                speed: 3.2
            };

            let boss = {
                x: canvas.width / 2,
                y: 100,
                radius: bossType === 'dragon' || bossType === 'record' ? 32 : 24,
                maxHp: initialMaxHp,
                hp: initialMaxHp,
                speed: bossType === 'dragon' || bossType === 'record' ? 1.6 : 1.8,
                strafeTimer: 0,
                strafeDir: 1,
                stunTimer: 0
            };

            let bullets = [];
            let enemyProjectiles = [];
            let timeLeft = (bossType === 'dragon' || bossType === 'training') ? 999 : (bossType === 'record' ? 60 : 30);
            let battleOver = false;
            let lastBossShotTime = 0;

            let skillOnCooldown = false;
            let timeStopTimer = 0;

            const skillBtn = document.getElementById('skill-btn');
            if (skillBtn) {
                const triggerSkill = (e) => {
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    if (skillOnCooldown || battleOver) return;
                    skillOnCooldown = true;

                    let cdTime = 15;
                    if (treasureName === '시간의 모래시계 코어') {
                        timeStopTimer = 150;
                        cdTime = 25;
                        showToast(`⏳ 시간 정지 발동! (2.5초 & 던전 시간 정지)`);
                    } else if (treasureName === '차원 파괴의 건틀릿') {
                        boss.stunTimer = 180;
                        let homingCount = 5;
                        for (let h = 0; h < homingCount; h++) {
                            setTimeout(() => {
                                if (!battleOver) {
                                    let angle = Math.atan2(boss.y - player.y, boss.x - player.x);
                                    bullets.push({
                                        x: player.x,
                                        y: player.y,
                                        startX: player.x,
                                        startY: player.y,
                                        vx: Math.cos(angle) * 9,
                                        vy: Math.sin(angle) * 9,
                                        radius: 18,
                                        maxDistance: 800,
                                        travelled: 0,
                                        color: '#ef4444',
                                        damage: Math.max(1500, Math.floor(playerPower * 4))
                                    });
                                }
                            }, h * 150);
                        }
                        showToast(`🌀 차원참 유도 발동! (3초 스턴)`);
                    } else if (treasureName === '사룡') {
                        boss.hp -= Math.max(15000, Math.floor(playerPower * 6));
                        enemyProjectiles = [];
                        showToast(`🐉 사룡멸천진 궁극기 발동!`);
                    } else if (treasureName === '태초의 아티팩트') {
                        boss.hp -= Math.max(8000, Math.floor(playerPower * 3));
                        enemyProjectiles = [];
                        showToast(`✨ 태초의 폭발 발동!`);
                    } else if (treasureName === '우주 창조의 핵') {
                        boss.hp -= Math.max(10000, Math.floor(playerPower * 3.5));
                        enemyProjectiles = [];
                        showToast(`🌌 초신성 붕괴 발동!`);
                    } else if (treasureName === '만물의 근원 오라브') {
                        boss.hp -= Math.max(8000, Math.floor(playerPower * 3));
                        enemyProjectiles = [];
                        showToast(`🌿 세계수의 가호 발동!`);
                    } else if (treasureName === '인피니티 크라운') {
                        boss.hp -= Math.max(10000, Math.floor(playerPower * 3.5));
                        enemyProjectiles = [];
                        showToast(`👑 왕의 영역 발동!`);
                    } else if (treasureName === '이터니티 하트') {
                        boss.hp -= Math.max(12000, Math.floor(playerPower * 3.8));
                        enemyProjectiles = [];
                        showToast(`❤️ 불멸의 심장박동 발동!`);
                    }

                    const hpBar = document.getElementById('boss-hp-bar');
                    const hpText = document.getElementById('boss-hp-text');
                    if (hpBar && hpText && bossType !== 'training') {
                        let pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
                        hpBar.style.width = pct + '%';
                        hpText.innerText = `${Math.max(0, boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()}`;
                    }

                    if (bossType !== 'training' && boss.hp <= 0) {
                        battleOver = true;
                        let winMsg = "🎉 보스를 토벌하고 승리했습니다!";
                        if (bossType === 'record') {
                            winMsg = `🎉 기록 던전 ${gameState.recordDungeonFloor}층 클리어! (다음 층으로 진입)`;
                        }
                        endBattle(true, winMsg, bossType);
                        return;
                    }

                    const overlay = document.getElementById('skill-cooldown-overlay');
                    if (overlay) {
                        overlay.classList.remove('hidden');
                        let rem = cdTime;
                        overlay.innerText = rem + 's';
                        let cdInterval = setInterval(() => {
                            rem--;
                            if (rem > 0) {
                                overlay.innerText = rem + 's';
                            } else {
                                clearInterval(cdInterval);
                                overlay.classList.add('hidden');
                                skillOnCooldown = false;
                            }
                        }, 1000);
                    }
                };

                skillBtn.addEventListener('click', triggerSkill);
                skillBtn.addEventListener('touchstart', triggerSkill, { passive: false });
            }

            let moveVector = { x: 0, y: 0 };
            let aimVector = { x: 0, y: 0 };
            let isAiming = false;

            let timerInterval = null;
            if (bossType !== 'dragon' && bossType !== 'training') {
                timerInterval = setInterval(() => {
                    if (battleOver) {
                        clearInterval(timerInterval);
                        return;
                    }
                    if (timeStopTimer > 0) return;

                    timeLeft--;
                    const timerEl = document.getElementById('battle-timer');
                    if (timerEl) timerEl.innerText = timeLeft + 's';

                    if (timeLeft <= 0) {
                        endBattle(false, "⏰ 시간 초과! 제한시간 내에 보스를 토벌하지 못했습니다.", bossType);
                    }
                }, 1000);
            }

            const padLeft = document.getElementById('pad-left');
            const knobLeft = document.getElementById('knob-left');
            const padRight = document.getElementById('pad-right');
            const knobRight = document.getElementById('knob-right');

            function setupPrecisionPad(pad, knob, isMove) {
                let activeId = null;
                let startX = 0, startY = 0;

                const onStart = (identifier, clientX, clientY) => {
                    if (activeId !== null) return;
                    activeId = identifier;
                    const rect = pad.getBoundingClientRect();
                    startX = rect.left + rect.width / 2;
                    startY = rect.top + rect.height / 2;
                };

                const onMove = (identifier, clientX, clientY) => {
                    if (activeId !== identifier) return;
                    let dx = clientX - startX;
                    let dy = clientY - startY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 36;

                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }

                    knob.style.transform = `translate(${dx}px, ${dy}px)`;

                    let nx = dx / maxDist;
                    let ny = dy / maxDist;

                    if (isMove) {
                        moveVector = { x: nx, y: ny };
                    } else {
                        aimVector = { x: nx, y: ny };
                        isAiming = dist > 8;
                    }
                };

                const onEnd = (identifier) => {
                    if (activeId !== identifier) return;
                    activeId = null;
                    knob.style.transform = `translate(0px, 0px)`;
                    if (isMove) {
                        moveVector = { x: 0, y: 0 };
                    } else {
                        if (isAiming && (aimVector.x !== 0 || aimVector.y !== 0)) {
                            let angle = Math.atan2(aimVector.y, aimVector.x);
                            let rectWidth = 30;
                            let baseRangeLength = 50;
                            let maxTravelDistance = baseRangeLength * rangeMultiplier;

                            // POWER EQUALS DAMAGE: Normal bullet damage equals playerPower directly!
                            bullets.push({
                                x: player.x,
                                y: player.y,
                                startX: player.x,
                                startY: player.y,
                                vx: Math.cos(angle) * 7.5,
                                vy: Math.sin(angle) * 7.5,
                                radius: rectWidth / 2,
                                maxDistance: maxTravelDistance,
                                travelled: 0,
                                color: bulletColor,
                                damage: Math.max(10, playerPower)
                            });
                        }
                        aimVector = { x: 0, y: 0 };
                        isAiming = false;
                    }
                };

                pad.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    onStart(touch.identifier, touch.clientX, touch.clientY);
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (activeId === null) return;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        const touch = e.changedTouches[i];
                        if (touch.identifier === activeId) {
                            onMove(touch.identifier, touch.clientX, touch.clientY);
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchend', (e) => {
                    if (activeId === null) return;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        const touch = e.changedTouches[i];
                        if (touch.identifier === activeId) {
                            onEnd(touch.identifier);
                        }
                    }
                }, { passive: false });

                pad.addEventListener('mousedown', (e) => {
                    onStart('mouse', e.clientX, e.clientY);
                });

                window.addEventListener('mousemove', (e) => {
                    if (activeId === 'mouse') {
                        onMove('mouse', e.clientX, e.clientY);
                    }
                });

                window.addEventListener('mouseup', () => {
                    if (activeId === 'mouse') {
                        onEnd('mouse');
                    }
                });
            }

            setupPrecisionPad(padLeft, knobLeft, true);
            setupPrecisionPad(padRight, knobRight, false);

            function gameLoop() {
                if (battleOver) return;

                if (timeStopTimer > 0) {
                    timeStopTimer--;
                }

                if (moveVector.x !== 0 || moveVector.y !== 0) {
                    let len = Math.sqrt(moveVector.x * moveVector.x + moveVector.y * moveVector.y);
                    let normX = moveVector.x / len;
                    let normY = moveVector.y / len;
                    player.x += normX * player.speed;
                    player.y += normY * player.speed;
                }
                player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    let stepDist = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                    b.travelled += stepDist;

                    let bDist = Math.sqrt((b.x - boss.x) ** 2 + (b.y - boss.y) ** 2);
                    if (bDist < boss.radius + b.radius) {
                        boss.hp -= b.damage;
                        bullets.splice(i, 1);

                        const hpBar = document.getElementById('boss-hp-bar');
                        const hpText = document.getElementById('boss-hp-text');
                        if (hpBar && hpText) {
                            if (bossType === 'training') {
                                hpBar.style.width = '100%';
                                hpText.innerText = `${boss.hp.toLocaleString()} HP (훈련중)`;
                            } else {
                                let pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
                                hpBar.style.width = pct + '%';
                                hpText.innerText = `${Math.max(0, boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()}`;
                            }
                        }

                        if (bossType !== 'training' && boss.hp <= 0) {
                            battleOver = true;
                            if (timerInterval) clearInterval(timerInterval);
                            let winMsg = "🎉 보스를 토벌하고 승리했습니다!";
                            if (bossType === 'record') {
                                winMsg = `🎉 기록 던전 ${gameState.recordDungeonFloor}층 클리어! (다음 층으로 진입)`;
                            }
                            endBattle(true, winMsg, bossType);
                            return;
                        }
                        continue;
                    }

                    if (b.travelled >= b.maxDistance || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        bullets.splice(i, 1);
                    }
                }

                if (timeStopTimer === 0) {
                    if (boss.stunTimer > 0) {
                        boss.stunTimer--;
                    } else {
                        boss.strafeTimer++;
                        if (boss.strafeTimer > 90) {
                            boss.strafeDir *= -1;
                            boss.strafeTimer = 0;
                        }

                        let pDist = Math.sqrt((player.x - boss.x) ** 2 + (player.y - boss.y) ** 2);
                        let bAngle = Math.atan2(player.y - boss.y, player.x - boss.x);

                        let moveAngle = bAngle;
                        if (pDist < 160) {
                            moveAngle += Math.PI / 2 * boss.strafeDir;
                        } else if (pDist > 240) {
                            moveAngle = bAngle;
                        } else {
                            moveAngle += Math.PI / 2 * boss.strafeDir;
                        }

                        boss.x += Math.cos(moveAngle) * boss.speed;
                        boss.y += Math.sin(moveAngle) * boss.speed;
                        boss.x = Math.max(boss.radius, Math.min(canvas.width - boss.radius, boss.x));
                        boss.y = Math.max(boss.radius, Math.min(canvas.height - boss.radius, boss.y));
                    }

                    let nowTime = Date.now();
                    // Red dragon shoots every 1000ms (1 second), with slower projectile speed (3.0 instead of 4.5)
                    let shotCooldown = bossType === 'dragon' ? 1000 : ((bossType === 'record') ? 800 : 1000);
                    let projSpeed = bossType === 'dragon' ? 3.0 : 4.5;

                    if (bossType !== 'training' && nowTime - lastBossShotTime > shotCooldown) {
                        let shootAngle = Math.atan2(player.y - boss.y, player.x - boss.x);
                        enemyProjectiles.push({
                            x: boss.x,
                            y: boss.y,
                            vx: Math.cos(shootAngle) * projSpeed,
                            vy: Math.sin(shootAngle) * projSpeed,
                            radius: 12.6,
                            color: (bossType === 'dragon' || bossType === 'record') ? '#ef4444' : '#78350f',
                            strokeColor: (bossType === 'dragon' || bossType === 'record') ? '#f87171' : '#b45309'
                        });
                        lastBossShotTime = nowTime;
                    }

                    for (let j = enemyProjectiles.length - 1; j >= 0; j--) {
                        let ep = enemyProjectiles[j];
                        ep.x += ep.vx;
                        ep.y += ep.vy;

                        let hitDist = Math.sqrt((player.x - ep.x) ** 2 + (player.y - ep.y) ** 2);
                        if (hitDist < player.radius + ep.radius) {
                            battleOver = true;
                            if (timerInterval) clearInterval(timerInterval);
                            endBattle(false, "💀 보스의 공격에 피격되어 쓰러졌습니다!", bossType);
                            return;
                        }

                        if (ep.x < 0 || ep.x > canvas.width || ep.y < 0 || ep.y > canvas.height) {
                            enemyProjectiles.splice(j, 1);
                        }
                    }

                    let pDistCheck = Math.sqrt((player.x - boss.x) ** 2 + (player.y - boss.y) ** 2);
                    if (bossType !== 'training' && pDistCheck < player.radius + boss.radius - 4) {
                        battleOver = true;
                        if (timerInterval) clearInterval(timerInterval);
                        endBattle(false, "💀 보스 몸통에 부딪혀 쓰러졌습니다!", bossType);
                        return;
                    }
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }

                ctx.fillStyle = (bossType === 'dragon' || bossType === 'record') ? '#ef4444' : (bossType === 'training' ? '#06b6d4' : '#22c55e');
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = (bossType === 'dragon' || bossType === 'record') ? '#f87171' : (bossType === 'training' ? '#67e8f9' : '#4ade80');
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.fillRect(boss.x - 24, boss.y - 38, 48, 6);
                ctx.fillStyle = (bossType === 'dragon' || bossType === 'record') ? '#ef4444' : '#06b6d4';
                ctx.fillRect(boss.x - 24, boss.y - 38, bossType === 'training' ? 48 : 48 * (boss.hp / boss.maxHp), 6);

                ctx.save();
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 3, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = ringColor;
                ctx.stroke();
                ctx.restore();

                let tempSvgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">${rawSvgInner}</svg>`;
                let base64Svg = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(tempSvgStr)));
                let spriteImg = new Image();
                spriteImg.src = base64Svg;
                if (spriteImg.complete && spriteImg.naturalWidth !== 0) {
                    ctx.drawImage(spriteImg, player.x - player.radius, player.y - player.radius, player.radius * 2, player.radius * 2);
                } else {
                    ctx.fillStyle = ringColor;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
                }

                bullets.forEach(b => {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                enemyProjectiles.forEach(ep => {
                    ctx.fillStyle = ep.color;
                    ctx.beginPath();
                    ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = ep.strokeColor;
                    ctx.stroke();
                });

                if (isAiming) {
                    let angle = Math.atan2(aimVector.y, aimVector.x);
                    let baseRangeLength = 50;
                    let rangeLength = baseRangeLength * rangeMultiplier;
                    let rectWidth = 30;

                    ctx.save();
                    ctx.translate(player.x, player.y);
                    ctx.rotate(angle);

                    ctx.fillStyle = 'rgba(148, 163, 184, 0.22)';
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);

                    ctx.beginPath();
                    ctx.rect(0, -rectWidth / 2, rangeLength, rectWidth);
                    ctx.fill();
                    ctx.stroke();

                    ctx.restore();
                }

                window.activeBattleAnimFrame = requestAnimationFrame(gameLoop);
            }

            window.activeBattleAnimFrame = requestAnimationFrame(gameLoop);
        }

        function endBattle(isWin, message, bossType) {
            if (window.activeBattleAnimFrame) {
                cancelAnimationFrame(window.activeBattleAnimFrame);
                window.activeBattleAnimFrame = null;
            }

            let goldReward = 0;
            let gemReward = 0;

            if (isWin) {
                if (bossType === 'dragon') {
                    goldReward = 5000;
                    gemReward = 20;
                } else if (bossType === 'goblin') {
                    goldReward = 500;
                    gemReward = 10;
                } else if (bossType === 'record') {
                    gemReward = 10;
                    gameState.recordDungeonFloor = (gameState.recordDungeonFloor || 1) + 1;
                }
                gameState.gold += goldReward;
                gameState.gems += gemReward;
                saveGame();
            }

            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            modal.innerHTML = `
                <div class="glass-panel w-full max-w-sm p-5 rounded-3xl border ${isWin ? 'border-amber-500/60' : 'border-rose-500/60'} flex flex-col items-center text-center shadow-2xl">
                    <span class="text-3xl mb-2">${isWin ? '🏆' : '💀'}</span>
                    <h3 class="text-base font-bold ${isWin ? 'text-amber-300' : 'text-rose-400'} mb-1">${isWin ? '전투 승리!' : '전투 패배'}</h3>
                    <p class="text-xs text-slate-300 mb-4">${message}</p>
                    ${isWin ? `
                        <div class="bg-black/40 p-3 rounded-2xl w-full mb-4 space-y-1 text-xs">
                            ${goldReward > 0 ? `<div class="text-amber-300 font-bold">🪙 ${goldReward.toLocaleString()} 골드 획득</div>` : ''}
                            ${gemReward > 0 ? `<div class="text-cyan-300 font-bold">💎 ${gemReward} 다이아 획득</div>` : ''}
                            ${bossType === 'record' ? `<div class="text-purple-300 font-bold mt-1">⭐ 최고 기록: ${gameState.recordDungeonFloor}층 달성!</div>` : ''}
                        </div>
                    ` : ''}
                    <button onclick="closeModal(); switchTab('battle');" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg">확인</button>
                </div>
            `;
        }

        /* --- 6. TRADE & SECRET CODES ('0327', '03270327', '032703270327') --- */
        function renderTradeView(container) {
            container.innerHTML = `
                <div class="p-4 flex flex-col items-center min-h-[75vh] pb-24 space-y-4">
                    <div class="text-center">
                        <h2 class="text-base font-bold text-amber-300 font-['Jua'] mb-1">교환실 & 자원 환전소</h2>
                        <p class="text-xs text-slate-400">100 골드를 다이아 50개로 환전하거나, 보물 및 재화를 친구에게 선물하세요!</p>
                    </div>

                    <div class="glass-panel w-full max-w-xs p-4 rounded-2xl border border-amber-500/40 bg-gradient-to-br from-amber-500/10 via-slate-900/80 to-slate-900/90 shadow-xl">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-amber-300">💱 골드 ➔ 다이아 환전소</span>
                            <span class="text-[10px] text-cyan-300 bg-cyan-950/60 px-2 py-0.5 rounded-full border border-cyan-500/30">🪙 100 ➔ 💎 50</span>
                        </div>
                        <p class="text-[11px] text-slate-300 mb-3">100 골드를 소모하여 즉시 50 다이아몬드를 획득합니다!</p>
                        <button onclick="exchangeGoldForDiamonds()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg active:scale-95 flex items-center justify-center space-x-1.5">
                            <span>🪙 100 골드 교환하기</span>
                        </button>
                    </div>

                    <div class="glass-panel w-full max-w-xs p-4 rounded-2xl border border-purple-500/40 space-y-3 bg-purple-950/20">
                        <span class="text-xs font-bold text-purple-300 block">📱 일회용 교환 & 송금 시스템</span>
                        <p class="text-[10px] text-slate-300 leading-relaxed">선물 코드를 생성하여 친구에게 보물이나 재화를 선물할 수 있습니다.</p>
                        <button onclick="openCompactExportModal()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs transition shadow">✨ 일회용 선물 코드 생성하기</button>
                        
                        <div class="pt-2 border-t border-purple-500/20 space-y-2">
                            <input id="compact-import-code" type="text" placeholder="친구의 교환 코드 붙여넣기" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 font-mono text-center">
                            <button onclick="redeemCompactCode()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition shadow">🎁 보물 및 재화 수령하기</button>
                        </div>
                    </div>

                    <div class="w-full max-w-xs pt-2">
                        <input id="dev-code-input" type="text" placeholder="개발자 코드 입력" oninput="checkDeveloperCode(this)" class="w-full bg-slate-950/60 border border-slate-800/60 rounded-xl px-3 py-2 text-[11px] text-slate-500 placeholder-slate-600 focus:outline-none focus:border-slate-700 font-mono text-center">
                    </div>
                </div>
            `;
        }

        function exchangeGoldForDiamonds() {
            if (gameState.gold < 100) {
                showToast("❌ 골드가 부족합니다! (필요: 100 골드)");
                return;
            }
            gameState.gold -= 100;
            gameState.gems += 50;
            saveGame();
            showToast("✨ 환전 성공! 💎 50 다이아를 획득했습니다!");
            updateHeader();
            if (currentTab === 'trade') {
                renderTradeView(document.getElementById('main-content'));
            }
        }

        function checkDeveloperCode(input) {
            const code = input.value.trim();
            if (code === '0327') {
                gameState.gold += 10000000;
                saveGame();
                input.value = '';
                showToast("🎉 [개발자 코드 승인] 🪙 10,000,000 골드가 충전되었습니다!");
                updateHeader();
            } else if (code === '03270327') {
                const dragonT = ALL_TREASURES_DATABASE.find(t => t.name === '사룡');
                if (dragonT) {
                    const alreadyHas = gameState.inventory.some(i => i.baseId === dragonT.id) || gameState.codexUnlocked.includes(dragonT.id);
                    if (alreadyHas) {
                        showToast("⚠️ 이미 '사룡'을 보유하고 있거나 도감에 등록되어 있습니다!");
                        input.value = '';
                        return;
                    }
                    gameState.inventory.push({
                        uid: `secret_dragon_${Date.now()}_${Math.random()}`,
                        baseId: dragonT.id,
                        enhanceLevel: 0,
                        evolutionStage: 0
                    });
                    if (!gameState.codexUnlocked.includes(dragonT.id)) {
                        gameState.codexUnlocked.push(dragonT.id);
                    }
                }
                gameState.gold += 10000000;
                saveGame();
                input.value = '';
                showToast("🐉 [비밀 코드 승인] 신화 보물 '사룡' 및 🪙 10,000,000 골드가 지급되었습니다!");
                updateHeader();
            } else if (code === '032703270327') {
                const mythicList = ALL_TREASURES_DATABASE.filter(t => t.rarity === 'MYTHIC');
                let addedCount = 0;
                mythicList.forEach(m => {
                    const alreadyHas = gameState.inventory.some(i => i.baseId === m.id);
                    if (!alreadyHas) {
                        gameState.inventory.push({
                            uid: `all_mythic_${m.id}_${Date.now()}_${Math.random()}`,
                            baseId: m.id,
                            enhanceLevel: 0,
                            evolutionStage: 0
                        });
                        addedCount++;
                    }
                    if (!gameState.codexUnlocked.includes(m.id)) {
                        gameState.codexUnlocked.push(m.id);
                    }
                });
                gameState.gold += 10000000;
                saveGame();
                input.value = '';
                showToast(`🌟 [궁극 비밀 코드 승인] 모든 신화 보물(${addedCount}개) 및 🪙 1,000만 골드 지급 완료!`);
                updateHeader();
            }
        }

        function openCompactExportModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');

            let html = `
                <div class="glass-panel w-full max-w-sm p-4 rounded-3xl border border-slate-700/80 flex flex-col max-h-[85vh] shadow-2xl">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-amber-300 font-['Jua']">보낼 보물 및 재화 선택</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xs">✕ 닫기</button>
                    </div>

                    <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-700/80 mb-3 space-y-2">
                        <div class="text-[11px] font-bold text-amber-300">🪙 보낼 골드 (보유: ${gameState.gold.toLocaleString()})</div>
                        <input id="trade-send-gold" type="number" min="0" max="${gameState.gold}" value="0" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-mono">
                        
                        <div class="text-[11px] font-bold text-cyan-300 pt-1">💎 보낼 다이아 (보유: ${gameState.gems.toLocaleString()})</div>
                        <input id="trade-send-gems" type="number" min="0" max="${gameState.gems}" value="0" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-cyan-300 font-mono">
                    </div>

                    <div class="text-[11px] font-bold text-slate-300 mb-2">함께 보낼 보물 선택 (선택사항)</div>
                    <div class="flex-1 overflow-y-auto grid grid-cols-2 gap-2">
                        <div onclick="generateCompactCode(null)" class="treasure-card-frame bg-slate-900/60 border border-slate-700 cursor-pointer hover:scale-[1.02] transition p-2.5 flex items-center justify-center text-center">
                            <span class="text-xs font-bold text-slate-300">📦 보물 없이<br>골드/다이아만 전송</span>
                        </div>
            `;

            gameState.inventory.forEach(item => {
                const base = ALL_TREASURES_DATABASE.find(t => t.id === item.baseId);
                const rInfo = RARITIES[base.rarity];
                const evoMeta = getEvolutionMeta(base, item.evolutionStage);
                const power = Math.floor(base.basePower * Math.pow(1.15, item.enhanceLevel) * Math.pow(1.5, item.evolutionStage));
                const stageClass = `evo-stage-${item.evolutionStage}`;

                html += `
                    <div onclick="generateCompactCode('${item.uid}')" class="treasure-card-frame ${rInfo.bg} ${stageClass} cursor-pointer hover:scale-[1.02] transition p-2.5">
                        <div class="absolute top-2 right-2 bg-black/40 px-1.5 py-0.5 rounded text-[8px] font-mono text-amber-300">+${item.enhanceLevel}</div>
                        <div class="treasure-icon-box bg-slate-900/80 my-auto w-12 h-12">${evoMeta.svg}</div>
                        <div class="text-[10px] ${rInfo.text} font-bold truncate w-full text-center mt-1">${evoMeta.name}</div>
                        <div class="text-[9px] text-amber-400 font-mono text-center">전력: ${power.toLocaleString()}</div>
                    </div>
                `;
            });

            html += `</div></div>`;
            modal.innerHTML = html;
        }

        function generateCompactCode(uid) {
            const sendGold = parseInt(document.getElementById('trade-send-gold').value) || 0;
            const sendGems = parseInt(document.getElementById('trade-send-gems').value) || 0;

            if (sendGold < 0 || sendGold > gameState.gold) {
                showToast("❌ 보낼 골드 수량이 잘못되었습니다.");
                return;
            }
            if (sendGems < 0 || sendGems > gameState.gems) {
                showToast("❌ 보낼 다이아 수량이 잘못되었습니다.");
                return;
            }

            gameState.gold -= sendGold;
            gameState.gems -= sendGems;

            let itemPayload = null;
            if (uid) {
                const itemIdx = gameState.inventory.findIndex(i => i.uid === uid);
                if (itemIdx !== -1) {
                    const item = gameState.inventory[itemIdx];
                    const base = ALL_TREASURES_DATABASE.find(t => t.id === item.baseId);
                    if (base && base.name === '사룡') {
                        showToast("❌ '사룡'은 선물로 보낼 수 없습니다!");
                        gameState.gold += sendGold;
                        gameState.gems += sendGems;
                        closeModal();
                        return;
                    }
                    gameState.inventory.splice(itemIdx, 1);
                    itemPayload = {
                        b: item.baseId,
                        e: item.enhanceLevel,
                        v: item.evolutionStage || 0,
                        id: item.uid
                    };
                }
            }

            saveGame();

            const tokenObj = {
                g: sendGold,
                d: sendGems,
                i: itemPayload,
                t: Date.now(),
                nonce: Math.random().toString(36).substring(2, 9)
            };

            const tokenString = btoa(encodeURIComponent(JSON.stringify(tokenObj)));

            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="glass-panel w-full max-w-sm p-5 rounded-3xl border border-slate-700/80 flex flex-col items-center text-center shadow-2xl">
                    <h3 class="text-sm font-bold text-amber-300 mb-2">✨ 일회용 선물 코드 생성 완료!</h3>
                    <p class="text-[11px] text-slate-300 mb-3">아래 코드를 복사해서 친구에게 전달해주세요. (이 코드는 단 1회만 사용 가능합니다)</p>
                    
                    <textarea readonly id="compact-token-box" class="w-full h-24 bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-[10px] text-amber-300 font-mono mb-3 select-all">${tokenString}</textarea>

                    <div class="flex space-x-2 w-full">
                        <button onclick="copyCompactTokenToClipboard()" class="flex-1 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs transition">코드 복사하기</button>
                        <button onclick="closeModal(); switchTab('trade');" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition">확인</button>
                    </div>
                </div>
            `;
        }

        function copyCompactTokenToClipboard() {
            const box = document.getElementById('compact-token-box');
            box.select();
            document.execCommand('copy');
            showToast("📋 교환 코드가 복사되었습니다!");
        }

        function redeemCompactCode() {
            const codeInput = document.getElementById('compact-import-code');
            const tokenStr = codeInput.value.trim();
            if (!tokenStr) {
                showToast("❌ 친구의 교환 코드를 입력해주세요!");
                return;
            }

            if (!gameState.usedTradeCodes) gameState.usedTradeCodes = [];

            if (gameState.usedTradeCodes.includes(tokenStr)) {
                showToast("❌ 이미 사용되었거나 만료된 일회용 교환 코드입니다!");
                return;
            }

            try {
                const decodedJson = decodeURIComponent(atob(tokenStr));
                const data = JSON.parse(decodedJson);

                if (data.i && data.i.b) {
                    const base = ALL_TREASURES_DATABASE.find(t => t.id === data.i.b);
                    if (base && base.name === '사룡') {
                        const alreadyHas = gameState.inventory.some(i => i.baseId === base.id) || gameState.codexUnlocked.includes(base.id);
                        if (alreadyHas) {
                            showToast("❌ 이미 '사룡'을 보유하고 있어 수령할 수 없습니다!");
                            return;
                        }
                    }
                }

                gameState.usedTradeCodes.push(tokenStr);

                let receivedSummary = [];
                if (data.g && data.g > 0) {
                    gameState.gold += data.g;
                    receivedSummary.push(`🪙 골드 ${data.g.toLocaleString()}`);
                }
                if (data.d && data.d > 0) {
                    gameState.gems += data.d;
                    receivedSummary.push(`💎 다이아 ${data.d.toLocaleString()}`);
                }
                if (data.i && data.i.b) {
                    gameState.inventory.push({
                        uid: `received_${data.i.b}_${Date.now()}_${Math.random()}`,
                        baseId: data.i.b,
                        enhanceLevel: data.i.e,
                        evolutionStage: data.i.v || 0
                    });

                    if (!gameState.codexUnlocked.includes(data.i.b)) {
                        gameState.codexUnlocked.push(data.i.b);
                    }
                    const base = ALL_TREASURES_DATABASE.find(t => t.id === data.i.b);
                    receivedSummary.push(`🎁 보물 (${base ? base.name : '신비한 보물'})`);
                }

                saveGame();
                codeInput.value = '';
                showToast(`🎉 수령 성공: ${receivedSummary.join(', ')}! (일회용 코드 소멸)`);
                switchTab('inventory');
            } catch (e) {
                showToast("❌ 올바르지 않거나 손상된 교환 코드입니다.");
            }
        }

        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
